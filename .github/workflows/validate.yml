name: Validate Plugins

on:
  push:
    branches: [main]
    paths:
      - 'plugins/**'
      - 'themes/**'
      - 'validator/**'
  pull_request:
    branches: [main]
    paths:
      - 'plugins/**'
      - 'themes/**'
      - 'validator/**'

jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '20.x'
    - run: cd ./validator && yarn install --frozen-lockfile
    - run: node --test ./validator/manifest-v3.test.js
    - run: node ./validate.js --ci
