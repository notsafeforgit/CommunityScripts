apiVersion: 3
name: Catalog Metadata
description: Import catalog metadata and map Stash edits back to manual catalog fields
version: 1.9.0
url: https://github.com/notsafeforgit/CommunityScripts/tree/main/plugins/catalogMetadata
exec:
- python
- '{pluginDir}/catalogMetadata.py'
interface: raw
ui:
  entry: index.js
  assets:
    /: ui
operations:
  list_reviews:
    kind: QUERY
    description: List source accounts, catalog performer UUIDs, profile evidence and conflicts without writes
  review_link:
    kind: QUERY
    description: Preview one account association, unlink or Stash binding without writes
  apply_link:
    kind: MUTATION
    description: Recheck and atomically apply one reviewed registry association; source catalogs stay separate
hooks:
- name: hook_catalogMetadata
  description: Apply catalog metadata when a scene or image is created
  triggeredBy:
  - Scene.Create.Post
  - Image.Create.Post
- name: write_catalogMetadata
  description: Write successful scene and image edits to the catalog
  triggeredBy:
  - Scene.Update.Post
  - Image.Update.Post
- name: sync_performer_catalogs
  description: Preserve catalog performer UUIDs, merge history and source account associations
  triggeredBy:
  - Performer.Merge.Post
  - Performer.Update.Post
tasks:
- name: Preview performer catalog links
  description: Report profile URL links, name-only candidates and conflicts without writing anything
  defaultArgs:
    mode: preview_performer_links
- name: Sync performer catalog links
  description: Apply explicit profile/account associations for existing performers; honors direction and dry run
  defaultArgs:
    mode: sync_performer_links
- name: Refresh tagged items from catalog
  description: Refresh scenes and images tagged _CATALOG_RELOAD, including organized items
  defaultArgs:
    mode: reload
settings:
  sync_direction:
    type: STRING
    editor: SELECT
    displayName: Sync direction
    description: Imports run on creation and tagged refresh. Exports run after successful Stash edits.
    default: both
    options:
    - value: both
      label: Both directions
    - value: import
      label: Catalog to Stash
    - value: export
      label: Stash to catalog
  dry_mode:
    type: BOOLEAN
    displayName: Dry run
    default: false
  sync_performer_catalogs:
    type: BOOLEAN
    displayName: Sync performer identities to catalogs
    description: >-
      Maintain catalog-owned performer UUIDs after Stash merges or identity edits. Match Twitter/X, Reddit,
      Instagram, Bluesky, TikTok, Coomer/Kemono service accounts and captured profile URLs from other extractors.
      Accounts, source catalogs and folders stay separate. Names alone require review. Requires Stash-to-catalog sync.
    default: true
  performer_account_links:
    type: JSON
    editor: JSON
    displayName: Legacy performer account links
    description: >-
      Map stable catalog account keys to Stash performer ID strings, for example {"twitter:id:12345":"42","reddit:id:t2_abc":"42"}.
      Used to import associations from earlier plugin versions. Registry decisions, including intentional unlinks,
      take precedence. Manage new links, reassignments and unlinks on the Catalog review page.
    default: {}
  performer_link_namespace:
    type: STRING
    displayName: Performer link namespace
    description: Stable name for this Stash library's IDs in the catalog. Use a different value for another Stash database; keep this value when restoring this database.
    default: stash
  filename_title_fallback:
    type: BOOLEAN
    displayName: Use filename when title is missing
    description: >-
      Use the filename without its extension when imports and the existing Stash title are empty.
      Includes unmatched scenes and images outside the catalog source.
      Explicit title mappings and exclusions take precedence.
    default: true
  skip_organized:
    type: BOOLEAN
    displayName: Skip organized items on creation
    description: >-
      Skip importing when the scene or image is already marked organized in Stash when its creation hook runs.
      Reads that item's organized flag by its Stash ID; no filename or title matching is involved.
      Refresh tagged items from catalog includes organized items regardless of this setting.
    default: true
  set_organized_catalog:
    type: BOOLEAN
    displayName: Mark imported items organized
    description: >-
      After a catalog or XML import, mark the item organized only if the required metadata is present.
      By default this requires title, performers, details, date, studio, tags, and cover image.
      Checks standard import data and folder defaults before custom mappings; an organized mapping can override it.
      Turning this off does not unmark existing items. Requirements are configured in config.py (set_organized_only_if).
    default: true
  create_missing_performers:
    type: BOOLEAN
    displayName: Create missing performers
    default: false
  create_missing_studios:
    type: BOOLEAN
    displayName: Create missing studios
    default: false
  create_missing_tags:
    type: BOOLEAN
    displayName: Create missing tags
    default: false
  create_missing_movies:
    type: BOOLEAN
    displayName: Create missing groups
    default: false
  reload_tag:
    type: STRING
    displayName: Refresh tag
    default: _CATALOG_RELOAD
  levenshtein_distance_tolerance:
    type: NUMBER
    displayName: Studio, group and tag name tolerance
    description: Performer matching always uses exact canonical names and aliases, ignoring case and surrounding whitespace.
    default: 2
  blacklist:
    type: STRING
    editor: JSON
    displayName: Standard import exclusions
    description: JSON array of standard import fields to exclude. Explicit import mappings take precedence.
    default: '["rating"]'
  scene_import_mappings:
    type: JSON
    editor: JQ_MAP
    preview:
      entity: SCENE
      description: Tests custom mappings only, including organized items. An empty mapping returns {}. Does not run the standard import, title fallback, or entity creation.
    displayName: Scene import mappings
    description: 'Map each target Stash update field to a jq expression. Input: .catalog (resolved metadata), .observations[].payload
      (source JSON), .stash (current item), .path. Overrides standard imports; empty leaves a field untouched.'
    default: {}
  scene_export_mappings:
    type: JSON
    editor: JQ_MAP
    preview:
      entity: SCENE
      description: Simulates a metadata edit using current values. Edit .fields and .input in the sample JSON to test specific changes. The refresh tag is omitted from .stash.tags. Shows jq output before unchanged-value filtering; nothing is written.
    displayName: Scene export mappings
    description: 'Map each target catalog manual field to a jq expression. Input also includes .fields (changed Stash
      fields) and .input. The refresh tag is omitted from .stash.tags. Supported targets: title, details, date, director, studio, movie, actors,
      tags, urls. Empty skips; null removes an override and inherits source metadata.'
    default:
      title: select(.fields | index("title")) | .stash.title | select(type == "string" and length > 0)
      details: select(.fields | index("details")) | .stash.details | select(type == "string" and length > 0)
      date: select(.fields | index("date")) | .stash.date | select(type == "string" and length > 0)
      urls: select(.fields | index("urls") or index("url")) | .stash.urls | select(length > 0)
      studio: select(.fields | index("studio_id")) | .stash.studio.name | select(type == "string" and length > 0)
      actors: select(.fields | index("performer_ids")) | [.stash.performers[].name] | select(length > 0)
      tags: select(.fields | index("tag_ids")) | [.stash.tags[].name] | select(length > 0)
      director: select(.fields | index("director")) | .stash.director | select(type == "string" and length > 0)
      movie: select(.fields | index("groups") or index("movies")) | .stash.groups[0].group.name | select(type ==
        "string" and length > 0)
  image_import_mappings:
    type: JSON
    editor: JQ_MAP
    preview:
      entity: IMAGE
      description: Tests custom mappings only, including organized items. An empty mapping returns {}. Does not run the standard import, title fallback, or entity creation.
    displayName: Image import mappings
    description: 'Map each target Stash update field to a jq expression. Input: .catalog (resolved metadata), .observations[].payload
      (source JSON), .stash (current item), .path. Overrides standard imports; empty leaves a field untouched.'
    default: {}
  image_export_mappings:
    type: JSON
    editor: JQ_MAP
    preview:
      entity: IMAGE
      description: Simulates a metadata edit using current values. Edit .fields and .input in the sample JSON to test specific changes. The refresh tag is omitted from .stash.tags. Shows jq output before unchanged-value filtering; nothing is written.
    displayName: Image export mappings
    description: 'Map each target catalog manual field to a jq expression. Input also includes .fields (changed Stash
      fields) and .input. The refresh tag is omitted from .stash.tags. Supported targets: title, details, date, director, studio, movie, actors,
      tags, urls. Empty skips; null removes an override and inherits source metadata.'
    default:
      title: select(.fields | index("title")) | .stash.title | select(type == "string" and length > 0)
      details: select(.fields | index("details")) | .stash.details | select(type == "string" and length > 0)
      date: select(.fields | index("date")) | .stash.date | select(type == "string" and length > 0)
      urls: select(.fields | index("urls") or index("url")) | .stash.urls | select(length > 0)
      studio: select(.fields | index("studio_id")) | .stash.studio.name | select(type == "string" and length > 0)
      actors: select(.fields | index("performer_ids")) | [.stash.performers[].name] | select(length > 0)
      tags: select(.fields | index("tag_ids")) | [.stash.tags[].name] | select(length > 0)
